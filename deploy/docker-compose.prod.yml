# RemindMe 正式環境（Oracle Cloud ARM VM）
#
# 在 repo 根目錄執行：
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# 或直接用 deploy/deploy.sh。
#
# 網路：只有 caddy 對外開 80/443；backend 的 3000 與 db 的 5432 只在 compose 內部網路可見。
# caddy 同時提供網頁版前端（手機瀏覽器用）：映像檔由 frontend/Dockerfile 建置，
# 靜態檔在映像檔的 /srv，API 路徑轉給 backend（見 deploy/Caddyfile）。

name: remindme

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: remindme
      POSTGRES_USER: remindme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 deploy/.env 設定 POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U remindme -d remindme']
      interval: 5s
      timeout: 5s
      retries: 20
    # 不設定 ports：資料庫不對外開放

  backend:
    build:
      context: ../backend
    image: remindme-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://remindme:${POSTGRES_PASSWORD:?請在 deploy/.env 設定 POSTGRES_PASSWORD}@db:5432/remindme?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?請在 deploy/.env 設定 JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://tauri.localhost,tauri://localhost}
    # 只在內部網路開放 3000（給 caddy 用），不對 host 開 port
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  caddy:
    # 以 caddy:2 為基底、內含網頁版前端靜態檔（frontend/Dockerfile）。
    # NEXT_PUBLIC_API_BASE_URL 在建置時寫進前端；網頁版與 API 同網域，所以就是 https://<DOMAIN>。
    # 改了 DOMAIN 或前端程式碼都要重新 build（deploy.sh 每次都會 build）。
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN:?請在 deploy/.env 設定 DOMAIN}
    image: remindme-web:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN:?請在 deploy/.env 設定 DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  caddy_data:
  caddy_config:
