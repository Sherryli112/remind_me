# 本機開發用：只起 PostgreSQL。
#   docker compose up -d db
# 後端在本機用 `npm run start:dev` 跑，連 localhost:5432。
# 正式環境（雲端 VM）請用 deploy/docker-compose.prod.yml，見 deploy/README.md。
services:
  db:
    image: postgres:16
    container_name: remindme-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: remindme
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - remindme_dev_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d remindme']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  remindme_dev_pg_data:
