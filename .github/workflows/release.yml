name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 雲端 API 位址在建置時寫進前端（NEXT_PUBLIC_API_BASE_URL）與 Rust 輪詢器（REMINDME_API_BASE_URL），
# 值來自 repository variable API_BASE_URL（Settings → Secrets and variables → Actions → Variables），
# 例如 https://remindme.duckdns.org。沒設定的話會建出打 localhost 的版本，所以下面會先檢查。
env:
  NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
  REMINDME_API_BASE_URL: ${{ vars.API_BASE_URL }}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: 'src-tauri -> target'

      - name: Check API_BASE_URL variable
        shell: pwsh
        run: |
          if (-not $env:NEXT_PUBLIC_API_BASE_URL) {
            Write-Error "尚未設定 repository variable API_BASE_URL（雲端後端網址，例如 https://remindme.duckdns.org）"
            exit 1
          }
          if (-not $env:NEXT_PUBLIC_API_BASE_URL.StartsWith('https://')) {
            Write-Error "API_BASE_URL 必須是 https:// 開頭：$env:NEXT_PUBLIC_API_BASE_URL"
            exit 1
          }
          Write-Host "API base URL: $env:NEXT_PUBLIC_API_BASE_URL"

      - name: Install and build frontend
        shell: pwsh
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Tauri installer and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RemindMe ${{ github.ref_name }}'
          releaseBody: |
            ## 安裝說明

            ### Windows
            1. 下載 `RemindMe_x.x.x_x64-setup.exe`
            2. 雙擊執行安裝
            3. 安裝完成後從開始選單或桌面捷徑啟動

            > **注意**：首次安裝時 Windows SmartScreen 可能顯示警告，點選「仍要執行」即可繼續。
            > 資料儲存於雲端，需登入使用。
          releaseDraft: false
          prerelease: false
